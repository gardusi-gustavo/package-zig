name: generate

# Manual only. Turns a selected issue into a draft pull request using the
# repository's own GITHUB_TOKEN and opencode. Draft means "waiting": no CI runs
# until the operator marks it ready for review.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to build
        required: true
      branch:
        description: Branch to create
        required: true
        default: "bot/change"
      title:
        description: Pull request title
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          if [ -x scripts/generate.sh ]; then
            bash scripts/generate.sh "$ISSUE"
          else
            echo "missing scripts/generate.sh"
            exit 1
          fi

      - name: Commit and push
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${{ inputs.branch }}"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no changes"
            exit 0
          fi
          git commit -m "${{ inputs.title }}"
          git push -u origin "${{ inputs.branch }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open draft pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base main --head "${{ inputs.branch }}" \
            --title "${{ inputs.title }}" \
            --body "Draft prepared from issue #${{ inputs.issue }} by opencode." \
            --draft || true
